name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix and Build APK
        run: |
          flutter create --platforms=android .
          sed -i 's/compileSdkVersion 36/compileSdkVersion 37/g' android/app/build.gradle || true
          sed -i 's/compileSdk = 36/compileSdk = 37/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdk 36/compileSdk 37/g' android/app/build.gradle.kts || true
          flutter clean
          flutter pub get
          flutter build apk --release
