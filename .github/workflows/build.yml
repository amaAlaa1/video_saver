name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Manifest & Build
        run: |
          flutter create . --platforms=android
          flutter pub add hive hive_flutter receive_sharing_intent path_provider
          flutter pub get
          
          # تعديل الـ SDK إلى 37
          sed -i 's/compileSdk = .*/compileSdk = 37/' android/app/build.gradle* || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 37/' android/app/build.gradle* || true

          # إضافة إذن استقبال المشاركة (Intent Filter) إلى AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          INTENT_FILTER='<intent-filter><action android:name="android.intent.action.SEND"/><category android:name="android.intent.category.DEFAULT"/><data android:mimeType="text/plain"/></intent-filter></activity>'
          sed -i "s|</activity>|$INTENT_FILTER|g" $MANIFEST_PATH

          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
